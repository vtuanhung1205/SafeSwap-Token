services:
  - type: web
    name: safeswap-backend
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: APTOS_NETWORK
        value: testnet
      - key: APTOS_NODE_URL
        value: https://fullnode.testnet.aptoslabs.com/v1
      - key: APTOS_FAUCET_URL
        value: https://faucet.testnet.aptoslabs.com
      - key: ALLOWED_ORIGINS
        value: https://safeswap-frontend.onrender.com,http://localhost:3000,http://localhost:5173
      - key: LOG_FORMAT
        value: combined
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
