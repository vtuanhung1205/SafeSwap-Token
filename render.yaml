services:
  - type: web
    name: safeswap-backend-service
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        value: mongodb+srv://safeswap_user:12345@safeswap.6pk7wds.mongodb.net/safeswap?retryWrites=true&w=majority&appName=SafeSwap
      - key: APTOS_NETWORK
        value: mainnet
      - key: APTOS_NODE_URL
        value: https://fullnode.mainnet.aptoslabs.com/v1
      - key: FRONTEND_URL
        value: https://safeswap-frontend.onrender.com
      - key: JWT_SECRET
        value: SafeSwap2025SecureJWTSecretKeyForProductionUse!@#$%
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: LOG_FORMAT
        value: combined
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: BCRYPT_ROUNDS
        value: 12
      - key: JWT_REFRESH_SECRET
        value: SafeSwap2025RefreshTokenSecretKeyForProductionUse!@#$%
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: AI_SERVICE_URL
        value: https://safeswap-ai-service.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://safeswap-frontend.onrender.com,http://localhost:5173

  - type: web
    name: safeswap-frontend
    env: static
    rootDir: Frontend
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://safeswap-backend-service.onrender.com/api
      - key: VITE_WEBSOCKET_URL
        value: https://safeswap-backend-service.onrender.com
      - key: VITE_APP_NAME
        value: SafeSwap
      - key: VITE_APP_VERSION
        value: 1.0.0
      - key: VITE_ENABLE_AI_DETECTION
        value: true
      - key: VITE_ENABLE_REAL_TIME_PRICES
        value: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
