<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSwap Wallet</title>
    <style>
        body {
            width: 320px;
            min-height: 400px;
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .logo {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 24px;
        }
        
        .title {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 4px;
        }
        
        .subtitle {
            font-size: 12px;
            opacity: 0.8;
            margin: 0;
        }
        
        .status {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .status-item:last-child {
            margin-bottom: 0;
        }
        
        .status-label {
            opacity: 0.8;
        }
        
        .status-value {
            font-weight: 500;
        }
        
        .connected {
            color: #4ade80;
        }
        
        .disconnected {
            color: #f87171;
        }
        
        .button {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
        }
        
        .button-primary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .button-primary:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .button-secondary {
            background: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .button-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .account-info {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 12px;
            word-break: break-all;
        }
        
        .footer {
            text-align: center;
            font-size: 11px;
            opacity: 0.6;
            margin-top: 16px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🔒</div>
        <h1 class="title">SafeSwap Wallet</h1>
        <p class="subtitle">AIP-62 Compatible Aptos Wallet</p>
    </div>
    
    <div class="status">
        <div class="status-item">
            <span class="status-label">Status:</span>
            <span class="status-value" id="connectionStatus">Disconnected</span>
        </div>
        <div class="status-item">
            <span class="status-label">Network:</span>
            <span class="status-value">Aptos Mainnet</span>
        </div>
        <div class="status-item">
            <span class="status-label">Version:</span>
            <span class="status-value">1.0.0</span>
        </div>
    </div>
    
    <div id="accountInfo" class="account-info hidden">
        <div><strong>Account:</strong> <span id="accountAddress"></span></div>
        <div><strong>Public Key:</strong> <span id="publicKey"></span></div>
    </div>
    
    <button id="connectBtn" class="button button-primary">
        Connect Wallet
    </button>
    
    <button id="disconnectBtn" class="button button-secondary hidden">
        Disconnect
    </button>
    
    <button id="openDappBtn" class="button button-secondary">
        Open SafeSwap Dapp
    </button>
    
    <div class="footer">
        SafeSwap Wallet Extension v1.0.0
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
